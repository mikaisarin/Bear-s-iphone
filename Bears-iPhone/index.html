<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>30 Days of Us — Bear's iPhone</title>

<!-- Tailwind via CDN (preflight disabled so it never fights the hand-tuned iPhone styles below).
     You can freely add Tailwind utility classes while editing. -->
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { corePlugins: { preflight: false } };</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* =========================================================
   BASE
   ========================================================= */
:root{
  --blue:#0A84FF; --red:#FF453A; --green:#30D158; --yellow:#FFD60A;
  --l2:rgba(235,235,245,.6); --l3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6);
  --g1:#1C1C1E; --g2:#2C2C2E; --g3:#3A3A3C;
  /* fallback wallpaper (cool blue) — shows until you add your own image */
  --wallgrad: radial-gradient(120% 70% at 15% 5%, #3f78b5 0%, rgba(63,120,181,0) 55%),
              radial-gradient(90% 60% at 95% 95%, #23466f 0%, rgba(35,70,111,0) 60%),
              linear-gradient(165deg,#0c1f36 0%,#0b2e52 48%,#050f1d 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:#fff;
  background:radial-gradient(ellipse at 50% 0%,#11233a 0%,#05080e 70%);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Noto Sans Thai",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
h1,h2,h3,p{margin:0;font-weight:inherit}
img{display:block}
a{color:inherit}
.ic{display:inline-block;vertical-align:middle;flex:none}
.flex1{flex:1}
.dim{color:#a8a8a8}
img.missing{opacity:0!important}

/* placeholder look for any image you haven't supplied yet */
.ph{position:relative;background:linear-gradient(135deg,#1d3350 0%,#2c5078 50%,#162840 100%);overflow:hidden}
.ph::after{content:attr(data-ph);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:rgba(255,255,255,.35);padding:4px;pointer-events:none}
.ph > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}

/* =========================================================
   PHONE FRAME (iPhone 13 — 390 × 844)
   ========================================================= */
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#phone{position:relative;flex:none;width:414px;height:868px;padding:12px;border-radius:66px;
  background:linear-gradient(145deg,#33404f,#0e131a 55%,#26303c);
  box-shadow:0 0 0 1.5px #4a5768,0 0 0 4px #0b0e13,0 50px 100px rgba(0,0,0,.65);transform-origin:center}
#phone::before,#phone::after{content:'';position:absolute;width:4px;border-radius:3px;background:#2a3441}
#phone::before{left:-5px;top:180px;height:64px;box-shadow:0 84px 0 #2a3441}
#phone::after{right:-5px;top:220px;height:96px}
#screen{position:relative;width:390px;height:844px;border-radius:52px;overflow:hidden;background:#000;isolation:isolate}
body.bare #phone{padding:0;background:none;box-shadow:none;border-radius:0}
body.bare #phone::before,body.bare #phone::after{display:none}
body.bare #screen{border-radius:0}

#wall{position:absolute;inset:0;z-index:0;background:var(--wallgrad)}
#wall img,.lwall img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* status bar + notch */
#sbar{position:absolute;top:0;left:0;right:0;height:47px;z-index:96;display:flex;justify-content:space-between;align-items:center;
  padding:6px 24px 0 40px;pointer-events:none;font-weight:600;font-size:16px;letter-spacing:-.2px;
  font-family:-apple-system,"SF Pro Text","Inter",sans-serif}
#sbar .r{display:flex;gap:6px;align-items:center}
#notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:162px;height:32px;background:#000;border-radius:0 0 21px 21px;z-index:97}
#notch::after{content:'';position:absolute;top:9px;left:50%;transform:translateX(-50%);width:44px;height:5px;border-radius:3px;background:#111}

/* home indicator */
#homebar{position:absolute;bottom:0;left:0;right:0;height:30px;z-index:98;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;cursor:pointer}
#homebar i{width:134px;height:5px;border-radius:3px;background:#fff;opacity:.92;transition:transform .2s}
#homebar:hover i{transform:scaleX(1.08)}
#homebar.hide{display:none}

/* =========================================================
   LOCK SCREEN + PASSCODE
   ========================================================= */
#lock{position:absolute;inset:0;z-index:80;overflow:hidden;transition:transform .55s cubic-bezier(.3,.7,.2,1),opacity .45s}
#lock.gone{transform:translateY(-100%);opacity:0;pointer-events:none}
.lwall{position:absolute;inset:0;background:var(--wallgrad)}
#lockface{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:62px;cursor:pointer;transition:opacity .3s,transform .35s}
#lockface.away{opacity:0;transform:translateY(-30px);pointer-events:none}
.lk-date{font-size:21px;font-weight:600;opacity:.9;margin-top:10px}
.lk-time{font-size:94px;font-weight:600;line-height:1;letter-spacing:-1px;margin-top:0;text-shadow:0 2px 10px rgba(0,0,0,.15)}
.lk-bottom{position:absolute;bottom:50px;left:46px;right:46px;display:flex;justify-content:space-between}
.lk-btn{width:50px;height:50px;border-radius:50%;background:rgba(0,0,0,.32);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:center}
.lk-hint{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:13px;opacity:.7;animation:hint 2.4s ease-in-out infinite}
@keyframes hint{0%,100%{transform:translateY(0);opacity:.45}50%{transform:translateY(-4px);opacity:.85}}

#pass{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:112px;opacity:0;pointer-events:none;transition:opacity .3s}
#pass.on{opacity:1;pointer-events:auto}
#pass .pblur{position:absolute;inset:0;z-index:-1;backdrop-filter:blur(28px) brightness(.62);-webkit-backdrop-filter:blur(28px) brightness(.62)}
.pk-title{font-size:20px;font-weight:400}
.pk-dots{display:flex;gap:24px;margin:24px 0 12px}
.pk-dot{width:13px;height:13px;border-radius:50%;border:1.4px solid #fff;transition:background .1s}
.pk-dot.f{background:#fff}
.pk-dots.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}14%{transform:translateX(-20px)}28%{transform:translateX(17px)}42%{transform:translateX(-13px)}56%{transform:translateX(9px)}70%{transform:translateX(-5px)}84%{transform:translateX(2px)}}
.pk-msg{height:20px;font-size:14px;margin-bottom:34px;opacity:0;transition:opacity .2s}
.pk-msg.on{opacity:1}
.pk-pad{display:grid;grid-template-columns:repeat(3,78px);gap:16px 26px}
.pk-key{width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .35s}
.pk-key.hit{background:rgba(255,255,255,.55);transition:none}
.pk-key b{font-size:36px;font-weight:400;line-height:1}
.pk-key small{font-size:10px;letter-spacing:2px;font-weight:600;margin-top:1px;height:12px}
.pk-zero{grid-column:2}
.pk-foot{position:absolute;bottom:54px;left:56px;right:56px;display:flex;justify-content:space-between;font-size:17px}

/* =========================================================
   HOME SCREEN
   ========================================================= */
#home{position:absolute;inset:0;z-index:10}
.hgrid{position:absolute;top:64px;left:22px;right:22px;display:grid;grid-template-columns:repeat(4,1fr);row-gap:17px}
.appi{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.ico-wrap{position:relative;width:60px;height:60px;transition:transform .22s cubic-bezier(.3,.7,.3,1.4),filter .2s}
.ico{position:absolute;inset:0;border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.ico > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.appi:hover .ico-wrap{transform:scale(1.1)}
.appi:active .ico-wrap{transform:scale(.9);filter:brightness(.7)}
/* calendar widget */
.appi.wgt{grid-column:span 2;grid-row:span 2}
.ico-wrap.wdg{width:158px;height:158px}
.appi.wgt:hover .ico-wrap{transform:scale(1.04)}
.appi.wgt:active .ico-wrap{transform:scale(.96)}
.wdg-cal{position:absolute;inset:0;border-radius:22px;background:#1c1c1e;padding:15px 16px 14px;display:flex;flex-direction:column;box-shadow:0 2px 12px rgba(0,0,0,.3);text-align:left}
.wdg-cal .wd{color:#ff453a;font-size:12.5px;font-weight:700;letter-spacing:.5px}
.wdg-cal b{font-size:46px;font-weight:400;line-height:1.02;letter-spacing:-1px}
.wdg-cal .ev{margin-top:auto;font-size:13px;line-height:1.25;color:#8e8e93}
.appi.wiggle .ico-wrap{animation:wig .4s}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.lbl{font-size:12px;font-weight:500;text-shadow:0 1px 3px rgba(0,0,0,.45);white-space:nowrap}
.badge{position:absolute;top:-7px;right:-7px;min-width:23px;height:23px;border-radius:12px;background:#FF3B30;font-size:14px;font-weight:500;
  display:none;align-items:center;justify-content:center;padding:0 7px;z-index:5;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.badge.on{display:flex}
.hsearch{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);padding:6px 12px;border-radius:14px;background:rgba(255,255,255,.16);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);font-size:13px;font-weight:600;display:flex;gap:4px;align-items:center}
.dock{position:absolute;left:12px;right:12px;bottom:12px;height:92px;border-radius:34px;display:flex;justify-content:space-around;align-items:center;padding:0 12px;
  background:rgba(90,120,160,.22);backdrop-filter:blur(30px) saturate(1.6);-webkit-backdrop-filter:blur(30px) saturate(1.6);border:.5px solid rgba(255,255,255,.08)}
#home.enter .appi{animation:icIn .6s cubic-bezier(.2,.8,.2,1) both}
#home.enter .dock{animation:icIn .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes icIn{from{transform:scale(1.5);opacity:0}to{transform:none;opacity:1}}

/* fallback icon art (shown until your icon images load) */
.g-cal{display:flex;flex-direction:column;align-items:center;line-height:1;color:#111}
.g-cal span{font-size:10px;font-weight:600;color:#ff3b30;letter-spacing:.3px;margin-top:3px}
.g-cal b{font-size:32px;font-weight:300}
.g-notes{position:absolute;inset:0;background:linear-gradient(#fcd34d 0 24%,#fff 24%)}
.g-notes::after{content:'';position:absolute;left:8px;right:8px;top:24px;bottom:9px;background:repeating-linear-gradient(transparent 0 8px,#d7d7d7 8px 9px)}
.g-word{font-weight:800;color:#fff;letter-spacing:-.4px}
.g-line{background:#fff;color:#06C755;font-weight:900;font-size:11px;padding:8px 6px 7px;border-radius:50%/46%;letter-spacing:-.2px;position:relative;line-height:1}
.g-line::after{content:'';position:absolute;right:8px;bottom:-3px;border:4px solid transparent;border-top-color:#fff;transform:rotate(25deg)}

/* =========================================================
   APPS (shared)
   ========================================================= */
.app{position:absolute;inset:0;z-index:30;display:none;opacity:0;transform:scale(.88);background:#000;
  transition:opacity .28s ease,transform .38s cubic-bezier(.2,.85,.2,1);border-radius:40px;overflow:hidden}
.app.open{display:block}
.app.show{opacity:1;transform:none;border-radius:0}
.stack{position:absolute;inset:0;overflow:hidden}
.view{position:absolute;inset:0;background:var(--vbg,#000);transition:transform .4s cubic-bezier(.2,.85,.2,1)}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
.scroll::-webkit-scrollbar,.hsc::-webkit-scrollbar{display:none}
.hsc{overflow-x:auto;scrollbar-width:none}
.av{border-radius:50%;overflow:hidden;flex:none;position:relative}
.av.gen{display:flex;align-items:center;justify-content:center;font-weight:600;color:#fff}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:83px;display:flex;justify-content:space-around;padding-top:7px;z-index:8}
.tabbar > *{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;width:72px}

/* =========================================================
   INSTAGRAM
   ========================================================= */
#app-instagram{--vbg:#000;font-family:-apple-system,"Inter","Noto Sans Thai",sans-serif}
#app-instagram .stack{bottom:83px}
.ig-tabbar{background:#000;border-top:.5px solid #262626;padding-top:12px;align-items:flex-start}
.ig-tabbar > *{width:56px}
.igt-av{width:28px;height:28px;border-radius:50%;padding:1.5px;border:1.5px solid transparent}
.igt-av.on{border-color:#fff}
.igt-av .av{width:100%;height:100%}
.ig-top{display:flex;align-items:center;justify-content:space-between;padding:50px 16px 4px}
.ig-logo{font-family:'Grand Hotel',cursive;font-size:33px;line-height:1.1;display:flex;align-items:center;gap:4px}
.ig-icons{display:flex;gap:22px;align-items:center}
.ig-tray{display:flex;gap:12px;padding:8px 10px 12px;border-bottom:.5px solid #262626}
.tray{display:flex;flex-direction:column;align-items:center;gap:5px;width:76px;flex:none}
.tray span{font-size:12px;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sring{width:76px;height:76px;border-radius:50%;padding:2.5px;background:linear-gradient(45deg,#feda75 5%,#fa7e1e 30%,#d62976 55%,#962fbf 80%,#4f5bd5);position:relative;flex:none}
.sring.seen{background:#3d3d3d;padding:1.5px}
.sring.none{background:transparent}
.sring-in{width:100%;height:100%;border-radius:50%;border:3px solid #000;overflow:hidden;position:relative}
.sring-in > .av{width:100%!important;height:100%!important}
.plusb{position:absolute;right:0;bottom:0;width:24px;height:24px;border-radius:50%;background:#0095f6;border:3px solid #000;display:flex;align-items:center;justify-content:center}
.post{padding-top:4px}
.post-h{display:flex;align-items:center;gap:10px;padding:6px 10px 8px 12px}
.post-who{flex:1;font-size:14px;line-height:1.25}
.post-who b{font-weight:600;cursor:pointer}
.post-who small{display:block;font-size:12px;color:#d0d0d0}
.post-img{width:100%;aspect-ratio:4/5}
.bigheart{position:absolute;left:50%;top:50%;z-index:3;transform:translate(-50%,-50%) scale(0);opacity:0;color:#fff;filter:drop-shadow(0 4px 12px rgba(0,0,0,.35))}
.bigheart.pop{animation:hpop .95s ease}
@keyframes hpop{0%{transform:translate(-50%,-50%) scale(0);opacity:0}15%{transform:translate(-50%,-50%) scale(1.2);opacity:1}30%{transform:translate(-50%,-50%) scale(.95)}45%,80%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(.2) translateY(-60px);opacity:0}}
.post-act{display:flex;align-items:center;gap:16px;padding:10px 12px 4px}
.lk.liked{color:#ff3040}
.lk.liked svg path{fill:#ff3040}
.lk.bump svg{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.25)}}
.post-likes{padding:2px 12px;font-size:14px;font-weight:600}
.post-cap,.post-cm{padding:3px 12px;font-size:14px;line-height:1.4}
.post-cap b,.post-cm b{font-weight:600;cursor:pointer}
.post-vall{display:block;padding:3px 12px;font-size:14px;color:#a8a8a8}
.post-time{padding:4px 12px 16px;font-size:11.5px;color:#a8a8a8}
.mention{color:#E0F1FF;cursor:pointer}
.ig-end{padding:30px 20px 40px;text-align:center;color:#a8a8a8;font-size:13px}
.ig-end b{display:block;color:#fff;font-size:16px;margin:8px 0 2px}
.ig-end .ok{width:60px;height:60px;border-radius:50%;margin:0 auto;padding:2px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf)}
.ig-end .ok div{width:100%;height:100%;border-radius:50%;background:#000;display:flex;align-items:center;justify-content:center}

.igp-h{display:flex;align-items:center;gap:16px;padding:50px 14px 6px}
.igp-h .u{flex:1;font-size:21px;font-weight:700;display:flex;align-items:center;gap:5px}
.igp-top{display:flex;align-items:center;padding:8px 16px 4px;gap:14px}
.igp-stats{flex:1;display:flex;justify-content:space-around;text-align:center}
.igp-stats > *{display:flex;flex-direction:column;align-items:center}
.igp-stats b{font-size:17px;font-weight:700}
.igp-stats span{font-size:13px}
.igp-bio{padding:6px 16px 2px;font-size:14px;line-height:1.38}
.igp-bio b{font-weight:600}
.igp-btns{display:flex;gap:6px;padding:10px 16px 4px}
.igp-btn{flex:1;height:32px;border-radius:8px;background:#363636;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px}
.igp-btn.sq{flex:none;width:34px}
.igp-hl{display:flex;gap:16px;padding:12px 16px 4px}
.hl{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.hlr{width:68px;height:68px;padding:1.5px;background:#3d3d3d}
.hlr.new{background:none;border:1px solid #555;display:flex;align-items:center;justify-content:center}
.igp-tabs{display:flex;margin-top:12px}
.igp-tabs span{flex:1;display:flex;justify-content:center;padding:10px 0;color:#737373;border-bottom:1px solid #262626}
.igp-tabs span.on{color:#fff;border-bottom-color:#fff}
.igp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5px}
.igp-cell{aspect-ratio:3/4;display:block}
.igp-cell .multi{position:absolute;top:6px;right:6px;z-index:3;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.igpl-h{position:sticky;top:0;z-index:5;background:#000;display:flex;align-items:center;justify-content:space-between;padding:48px 10px 8px}
.igpl-h div{text-align:center;line-height:1.2}
.igpl-h small{display:block;font-size:11px;color:#a8a8a8;font-weight:600}
.igpl-h b{font-size:16px;font-weight:700}
.igf-tabs{display:flex;border-bottom:.5px solid #262626}
.igf-tabs button{flex:1;padding:12px 0;font-size:14px;font-weight:600;color:#737373;text-align:center}
.igf-tabs .on{color:#fff;box-shadow:inset 0 -1px #fff}
.igf-search{margin:12px 14px 6px;background:#262626;border-radius:10px;height:36px;display:flex;align-items:center;gap:8px;padding:0 10px;color:#a8a8a8;font-size:15px}
.igf-sort{display:flex;justify-content:space-between;padding:10px 16px 4px;font-size:14px}
.igf-row{display:flex;align-items:center;gap:12px;padding:8px 14px}
.igf-row .n{flex:1;font-size:14px;line-height:1.3;min-width:0}
.igf-row .n b{display:block;font-weight:600}
.igf-row .n span{color:#a8a8a8}
.igf-btn{height:32px;padding:0 18px;border-radius:8px;background:#363636;font-weight:600;font-size:14px}
.igf-btn.blue{background:#0095f6}
.igc-row{display:flex;gap:12px;padding:10px 14px;font-size:14px;line-height:1.38}
.igc-row b{font-weight:600}
.igc-row small{display:block;color:#a8a8a8;font-size:12px;margin-top:4px}
.igc-row.cap{border-bottom:.5px solid #262626;padding-bottom:14px}

.story{position:absolute;inset:0;z-index:40;background:#000;display:none}
.story.on{display:block;animation:stIn .25s ease}
@keyframes stIn{from{transform:scale(.9);opacity:0}}
.st-img{position:absolute;left:0;right:0;top:46px;bottom:86px;border-radius:10px}
.st-shade{position:absolute;left:0;right:0;top:46px;height:110px;z-index:2;border-radius:10px 10px 0 0;background:linear-gradient(rgba(0,0,0,.45),transparent);pointer-events:none}
.st-bars{position:absolute;top:54px;left:8px;right:8px;display:flex;gap:3px;z-index:5}
.st-bar{flex:1;height:2.5px;background:rgba(255,255,255,.35);border-radius:2px;overflow:hidden}
.st-bar i{display:block;height:100%;width:0;background:#fff}
.st-bar.done i{width:100%}
.st-bar.cur i{animation:stfill 5s linear forwards}
@keyframes stfill{to{width:100%}}
.st-head{position:absolute;top:64px;left:12px;right:6px;display:flex;align-items:center;gap:8px;z-index:6;font-size:14px}
.st-head b{font-weight:600}
.st-time{color:rgba(255,255,255,.7)}
.st-tap{position:absolute;top:110px;bottom:90px;z-index:4}
.st-tap.l{left:0;width:35%}
.st-tap.r{right:0;width:65%}
.st-foot{position:absolute;bottom:30px;left:12px;right:12px;display:flex;align-items:center;gap:16px;z-index:5}

.cam-vf > video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.cam-vf > video.mirror,.cam-thumb video.mirror{transform:scaleX(-1)}
.cam-vf.flip{animation:camflip .6s ease}
@keyframes camflip{0%{transform:none;filter:none}50%{transform:perspective(900px) rotateY(90deg);filter:blur(14px)}100%{transform:none;filter:none}}
.cam-flash{position:absolute;inset:0;z-index:4;background:#000;opacity:0;pointer-events:none}
.cam-flash.go{animation:camfl .3s ease-out}
@keyframes camfl{0%{opacity:1}100%{opacity:0}}
.cam-wide{position:absolute;right:16px;bottom:14px;z-index:3;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}

.cam-thumb.has{background:#3a3a3c}

/* =========================================================

   Tip: open index.html?fast to run every story timer ~10x faster while testing.
   ========================================================= */
const TIMING = {
  firstMessage: 60000,        // 1 min after unlocking → LINE from cho
  autoReplyIfIgnored: 30000,  // if the player never opens cho's chat, Bear replies anyway
  callAfterReply: 30000,      // 30 sec after Bear's reply → Kongkwan calls
  ringFor: 30000,             // how long one call rings before it counts as missed
  redialGap: 60000,           // wait before Kongkwan calls again (3 calls max)
  finalMessageDelay: 4000     // after the call → cho: "ได้ เอาสิ"
};
const YOUTUBE_URL = 'https://youtu.be/s3avrFeOXUc?si=u009N4PPGilVfAF0';
const PASSCODE = '3017';

const FAST = new URLSearchParams(location.search).has('fast');
function wait(key, fn){
  const t = FAST ? Math.max(key === 'ringFor' ? 9000 : 1500, TIMING[key] / 10) : TIMING[key];
  return setTimeout(fn, t);
}

/* =========================================================
   HELPERS
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const fmt2 = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(Math.floor(s)%60).padStart(2,'0');
function src(key){ const el = document.getElementById('a-' + key); return el ? el.getAttribute('src') : ''; }
function has(key){ return !!document.getElementById('a-' + key); }
function img(key, alt = ''){ return `<img src="${esc(src(key))}" alt="${esc(alt)}" draggable="false" onerror="this.classList.add('missing')">`; }
function hue(str){ let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function genAv(name, size){
  const h = 190 + hue(name) % 60;
  const ch = (name.replace(/[^A-Za-z0-9\u0E00-\u0E7F]/g, '').charAt(0) || '?').toUpperCase();
  return `<div class="av gen" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.42)}px;background:linear-gradient(135deg,hsl(${h},40%,48%),hsl(${h+20},45%,28%))">${esc(ch)}</div>`;
}
function avatar(key, name, size){
  return has(key) ? `<div class="av ph" style="width:${size}px;height:${size}px">${img(key, name)}</div>` : genAv(name, size);
}
const igAv = (u, size) => avatar('avatar-' + u, u, size);

/* =========================================================
   NAVIGATION (per-app push / pop stack)
   ========================================================= */
const Nav = {
  st: {}, hooks: {},
  el(app){ return $('#app-' + app + ' .stack'); },
  root(app, html, mount){ const c = this.el(app); c.innerHTML = ''; this.st[app] = []; return this._add(app, html, mount, false); },
  push(app, html, mount){ return this._add(app, html, mount, true); },
  _add(app, html, mount, anim){
    const c = this.el(app), s = this.st[app] || (this.st[app] = []);
    const v = document.createElement('div'); v.className = 'view'; v.innerHTML = html;
    const prev = s[s.length - 1];
    if (anim) v.style.transform = 'translateX(100%)';
    c.appendChild(v); s.push(v);
    if (anim){ void v.offsetWidth; v.style.transform = ''; if (prev) prev.style.transform = 'translateX(-28%)'; }
    if (mount) mount(v);
    return v;
  },
  pop(app){
    const s = this.st[app]; if (!s || s.length < 2) return false;
    const v = s.pop(), prev = s[s.length - 1];
    v.style.transform = 'translateX(100%)'; prev.style.transform = '';
    setTimeout(() => v.remove(), 420);
    if (this.hooks[app]) this.hooks[app](prev);
    return true;
  },
  top(app){ const s = this.st[app]; return s && s[s.length - 1]; },
  depth(app){ return (this.st[app] || []).length; }
};

function screenScale(){ const r = $('#screen').getBoundingClientRect(); return r.width / 390; }
function openApp(id, fromEl){
  if (id === 'youtube'){ window.open(YOUTUBE_URL, '_blank', 'noopener'); return; }
  const a = APPS[id];
  if (!a){ if (fromEl){ fromEl.classList.remove('wiggle'); void fromEl.offsetWidth; fromEl.classList.add('wiggle'); } return; }

    el.style.transformOrigin = `${(r.left + r.width/2 - sr.left)/k}px ${(r.top + r.height/2 - sr.top)/k}px`;
  } else el.style.transformOrigin = '50% 50%';
  curApp = id;
  el.classList.add('open'); void el.offsetWidth; el.classList.add('show');

  if (a.onOpen) a.onOpen();

   ========================================================= */
let code = '';
(function buildPad(){
  const L = ['', 'ABC', 'DEF', 'GHI', 'JKL', 'MNO', 'PQRS', 'TUV', 'WXYZ'];
  let h = '';
  for (let i = 1; i <= 9; i++) h += `<button class="pk-key" data-act="pk" data-arg="${i}"><b>${i}</b><small>${L[i-1]}</small></button>`;
  h += `<button class="pk-key pk-zero" data-act="pk" data-arg="0"><b>0</b><small></small></button>`;
  $('#pk-pad').innerHTML = h;
})();
function showPass(){ if (!locked) return; $('#lockface').classList.add('away'); $('#pass').classList.add('on'); ac(); }
function hidePass(){ code = ''; pkDots(); $('#lockface').classList.remove('away'); $('#pass').classList.remove('on'); }
function pkDots(){
  $$('#pk-dots .pk-dot').forEach((d, i) => d.classList.toggle('f', i < code.length));
  $('#pk-cancel').textContent = code.length ? 'Delete' : 'Cancel';
}
ACT.pk = (d, el) => {
  if (code.length >= 4) return;
  if (el){ el.classList.add('hit'); setTimeout(() => el.classList.remove('hit'), 120); }
  tone(1200, 0, .05, .03);
  code += d; pkDots();
  if (code.length === 4) setTimeout(pkCheck, 160);
};
ACT.pkCancel = () => { if (code.length){ code = code.slice(0, -1); pkDots(); } else hidePass(); };
function pkCheck(){
  if (code === PASSCODE) return unlock();
  const dots = $('#pk-dots'); dots.classList.remove('shake'); void dots.offsetWidth; dots.classList.add('shake');
  if (navigator.vibrate) navigator.vibrate([70, 50, 70]);
  const m = $('#pk-msg'); m.classList.add('on'); clearTimeout(m._t); m._t = setTimeout(() => m.classList.remove('on'), 1600);
  setTimeout(() => { code = ''; pkDots(); }, 480);
}
function unlock(){
  locked = false;
  $('#lock').classList.add('gone');
  const h = $('#home'); h.classList.remove('enter'); void h.offsetWidth; h.classList.add('enter');
  $('#homebar').classList.add('hide');
  startGame();
}
(function lockGestures(){
  const f = $('#lockface'); let y0 = null;
  f.addEventListener('pointerdown', e => { y0 = e.clientY; });
  f.addEventListener('pointerup', e => { if (y0 !== null){ showPass(); } y0 = null; });
})();

/* home indicator: tap / swipe up = go home (or open passcode on the lock screen) */
(function homebar(){
  const hb = $('#homebar');
  hb.classList.remove('hide');
  hb.addEventListener('click', () => {
    if (locked){ showPass(); return; }
    if ($('#ig-story') && $('#ig-story').classList.contains('on')) stClose(true);
    closeApp();
  });
})();

/* keyboard: digits for passcode, Esc = back */
document.addEventListener('keydown', e => {
  if (locked){
    if (/^[0-9]$/.test(e.key)){ showPass(); ACT.pk(e.key, $(`.pk-key[data-arg="${e.key}"]`)); }
    else if (e.key === 'Backspace') ACT.pkCancel();
    return;
  }
  if (e.key === 'Escape'){
    if ($('#ig-story') && $('#ig-story').classList.contains('on')) return stClose(true);
    if ($('.pho-viewer.on')) return pvClose();
    if ($('.sp-np.on')) return ACT.spCloseNP();
    if (curApp && Nav.depth(curApp) > 1){ Nav.pop(curApp); return; }
    closeApp();
  }
});

/* =========================================================
   SOUND (Web Audio — no files needed)
   ========================================================= */
let AC = null;
function ac(){
  try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e){}
  return AC;
}
function tone(freq, start, dur, vol = .08, type = 'sine'){
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + start;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + .05);
}
function dingLine(){ tone(1318, 0, .22, .07); tone(1760, .11, .35, .06); }
const Ring = {
  iv: null,
  start(){ this.stop(); const p = () => [0, .17, .34, .51, .9, 1.07].forEach((t, i) => tone(i % 2 ? 988 : 1319, t, .15, .06, 'triangle')); p(); this.iv = setInterval(p, 2600); },
  stop(){ clearInterval(this.iv); this.iv = null; }
};

}
function stNext(){ const g = ST.seq[ST.ui]; if (!g) return; if (ST.ii < g.items.length - 1) ST.ii++; else { ST.ui++; ST.ii = 0; } stRender(); }

  clearTimeout(ST.t);

const CAL_YEAR = 2029, TODAY = { y: 2029, m: 0, d: 5 };   // today = Friday 5 January 2029
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function calInit(){
  const el = $('#app-calendar');
  el.innerHTML = `
    <div class="cal-top"><span style="display:flex;align-items:center">${ic('back', 26, 2.2)}<span id="cal-year">${CAL_YEAR}</span></span>
      <span class="ics">${ic('listIc', 24)}${ic('search', 24)}${ic('plus', 24, 2)}</span></div>
    <div class="cal-wd">${['S','M','T','W','T','F','S'].map((d, i) => `<span class="${i === 0 || i === 6 ? 'we' : ''}">${d}</span>`).join('')}</div>
    <div class="cal-scroll" id="cal-scroll"></div>
    <div class="cal-bottom"><button data-act="calToday">Today</button><span>Calendars</span><span>Inbox</span></div>`;
  const months = [[CAL_YEAR - 1, 11], [CAL_YEAR, 0], [CAL_YEAR, 1]];
  const sc = $('#cal-scroll');
  sc.innerHTML = months.map(([y, m]) => monthHTML(y, m)).join('') + '<div style="height:60px"></div>';
  sc.addEventListener('scroll', () => {
    let y = CAL_YEAR - 1;
    $$('.cal-month', sc).forEach(s => { if (s.offsetTop <= sc.scrollTop + 60) y = +s.dataset.y; });
    $('#cal-year').textContent = y;
  });
}
function monthHTML(y, m){
  const first = new Date(y, m, 1).getDay(), n = new Date(y, m + 1, 0).getDate();
  const cur = y === TODAY.y && m === TODAY.m;
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<div></div>';
  for (let d = 1; d <= n; d++){
    const dow = (first + d - 1) % 7, t = cur && d === TODAY.d;
    cells += `<button class="cal-day ${dow === 0 || dow === 6 ? 'we' : ''} ${t ? 'today sel' : ''}" data-act="calSel"><span>${d}</span></button>`;
  }
  return `<section class="cal-month" data-y="${y}" data-m="${m}"><div class="cal-mname ${cur ? 'cur' : ''}"><span style="grid-column-start:${first + 1}">${MON[m]}</span></div><div class="cal-days">${cells}</div></section>`;
}
function calOnOpen(){
  const sc = $('#cal-scroll'), j = $(`.cal-month[data-y="${TODAY.y}"][data-m="${TODAY.m}"]`, sc);
  if (j) sc.scrollTop = j.offsetTop - 2;
}

};

function spDur(){ return (Player.usingAudio && isFinite(audio.duration) && audio.duration > 0) ? audio.duration : SONGS[Player.i].d; }
function spPlay(i){
  Player.started = true;
  if (i !== Player.i){ Player.i = i; Player.pos = 0; }
  else if (Player.pos >= spDur() - .5) Player.pos = 0;
  spResume(true);
}
function spResume(fromPlay){
  const s = SONGS[Player.i];
  Player.playing = true; spStopFake(); Player.usingAudio = false;
  if (s.file){
    if (audio.dataset.cur !== s.file){ audio.src = s.file; audio.dataset.cur = s.file; }
    try { audio.currentTime = Player.pos; } catch(e){}
    const p = audio.play();
    Player.usingAudio = true;
    if (p && p.catch) p.catch(() => { if (Player.playing && SONGS[Player.i] === s){ Player.usingAudio = false; spStartFake(); } });
  } else { audio.pause(); spStartFake(); }
  spUI();
}
function spPause(){ Player.playing = false; audio.pause(); spStopFake(); spUI(); }
function spStartFake(){
  spStopFake();
  Player.fakeT = setInterval(() => {
    Player.pos += .25;
    if (Player.pos >= SONGS[Player.i].d){ ACT.spNext(); return; }
    spProgress();
  }, 250);
}
function spStopFake(){ clearInterval(Player.fakeT); Player.fakeT = null; }
function spSeek(v){ Player.pos = Math.min(v, spDur()); if (Player.usingAudio){ try { audio.currentTime = Player.pos; } catch(e){} } spProgress(); }

    LINE.chats[LINE.open].unread = 0;
    lineRenderChat(); updateBadges(); onChatViewed(LINE.open);
  }
  lineRenderList();
}
function isViewing(id){ return curApp === 'line' && LINE.open === id; }
function lineAdd(id, m, opt = {}){
  const c = LINE.chats[id];
  if (!c.today){ c.msgs.push({ d: 'Today' }); c.today = true; }
  m.isNew = true; c.msgs.push(m);
  c.last = m.call ? (m.call === 'missed' ? 'Missed call' : 'Voice call ' + m.dur) : m.x;
  c.time = m.tm;
  LINE.order = [id, ...LINE.order.filter(x => x !== id)];
  const viewing = isViewing(id);
  if (!viewing && m.f !== 'me' && !opt.silent){
    c.unread++;
    banner(opt.banner || { title: c.name, msg: m.x, chat: id });
  }
  if (viewing) lineRenderChat();
  lineRenderList(); updateBadges();
}
function openLineChat(id){
  if (locked) return;
  stClose(); pvClose();
  if (curApp && curApp !== 'line') closeApp(true);
  if (curApp !== 'line') openApp('line');
  if (LINE.open === id){ lineOnOpen(); return; }
  Nav.root('line', Nav.st.line[0].innerHTML);
  LINE.open = null; $('#app-line').classList.remove('in-chat');
  lineRenderList();
  ACT.lineChat(id);
}

const Game = { started: false, waitingReply: false, replyT: null, missed: 0, finalSent: false, ringing: false };
function startGame(){
  if (Game.started) return; Game.started = true;
  wait('firstMessage', choFirst);
}
function choFirst(){
  lineAdd('cho', { f: 'cho', x: 'พี่มึง มาทำเหี้ยอะไรเนี่ย', tm: '01:57' });
  Game.waitingReply = true;
  Game.replyT = wait('autoReplyIfIgnored', autoReply);
  if (isViewing('cho')) onChatViewed('cho');
}
function onChatViewed(id){
  if (id === 'cho' && Game.waitingReply){ clearTimeout(Game.replyT); Game.replyT = setTimeout(autoReply, 1800); }
}
function autoReply(){
  if (!Game.waitingReply) return; Game.waitingReply = false;
  lineAdd('cho', { f: 'me', x: 'อย่าเรียกพี่เลย ถ้าจะด่าเหี้ย', tm: '01:58' });
  setTimeout(() => {
    lineAdd('cho', { f: 'me', x: 'มาทำสัญญากัน ถ้าสามสิบวันมันไม่รอด กลับมาแบ่งสมบัติแล้วแยกย้าย', tm: '01:58' });
    wait('callAfterReply', () => Call.ring());
  }, 2400);
}
function choFinal(){
  if (Game.finalSent) return; Game.finalSent = true;
  lineAdd('cho', { f: 'cho', x: 'ได้ เอาสิ', tm: '02:04' });
}
const CALL_TIMES = ['02:01', '02:02', '02:03'];
const Call = {
  missT: null, tick: null, timers: [], at: '02:01',
  ring(){
    Game.ringing = true;
    const el = $('#incoming');
    el.innerHTML = `${avatar('line-kongkwan', 'Kongkwan', 52)}<div class="in-t"><b>Kongkwan</b><small>LINE Audio</small></div>
      <button class="cbtn red" data-act="callDecline">${ic('phoneF', 26)}</button><button class="cbtn grn" data-act="callAccept">${ic('phoneF', 26)}</button>`;
    el.classList.add('on');
    Ring.start(); Player.duck();
    if (navigator.vibrate) navigator.vibrate([400, 250, 400, 250, 400]);
    this.missT = wait('ringFor', () => this.miss());
  },
  stopRing(){ clearTimeout(this.missT); Game.ringing = false; $('#incoming').classList.remove('on'); Ring.stop(); },
  accept(){
    if (!Game.ringing) return;
    this.stopRing(); this.at = CALL_TIMES[Game.missed] || '02:01';
    const el = $('#incall');
    el.innerHTML = `<div class="ic-bgimg ph">${has('line-kongkwan') ? img('line-kongkwan') : ''}</div>
      <div class="ic-line">LINE</div>

      </div>`;
    el.classList.add('on');
    let sec = 0; this.tick = setInterval(() => { sec++; const s = $('#ic-sub'); if (s) s.textContent = fmt2(sec); }, 1000);
    const L = [['me', 'ครับของขวัญ'], ['kk', 'พี่แบร์ รบกวนเช็คเอกสารที่ส่งให้ในไลน์ทีค่ะ'], ['me', 'ได้ครับ เดี๋ยวพี่ลงเครื่องแล้วดูให้นะ รีบมั้ย'], ['kk', 'ไม่รีบค่ะ'], ['me', 'โอเค ขอบคุณนะของขวัญ']];
    const sc = $('#ic-script'); let t = 1100; this.timers = [];
    L.forEach(([w, x]) => {
      this.timers.push(setTimeout(() => {
        sc.insertAdjacentHTML('beforeend', `<div class="lm ${w === 'me' ? 'me' : ''} first new">${w === 'me' ? '' : avatar('line-kongkwan', 'Kongkwan', 30)}<div class="lb">${esc(x)}</div></div>`);
        sc.scrollTop = sc.scrollHeight;
      }, t));
      t += 1500 + x.length * 40;
    });
    this.timers.push(setTimeout(() => {
      sc.insertAdjacentHTML('beforeend', '<div class="ic-sys">Kongkwan ended the call</div>'); sc.scrollTop = sc.scrollHeight;
      clearInterval(this.tick); const s = $('#ic-sub'); if (s) s.textContent = 'Call ended';
      tone(620, 0, .25, .06); tone(460, .3, .35, .06);
    }, t + 400));
    this.timers.push(setTimeout(() => this.end(), t + 2600));
  },
  end(){
    const el = $('#incall'); if (!el.classList.contains('on')) return;
    this.timers.forEach(clearTimeout); clearInterval(this.tick);
    el.classList.remove('on');
    recentsCall(this.at);
    lineAdd('kongkwan', { f: 'kk', call: 'done', dur: '3:00', tm: this.at }, { silent: true });
    Player.unduck();
    setTimeout(choFinal, FAST ? 1500 : TIMING.finalMessageDelay);
  },
  miss(){
    if (!Game.ringing) return;
    this.stopRing();
    const tm = CALL_TIMES[Game.missed] || '02:03';
    Game.missed++;
    recentsMissed(tm);
    lineAdd('kongkwan', { f: 'kk', call: 'missed', tm }, { banner: { title: 'Kongkwan', msg: 'Missed LINE Audio call', chat: 'kongkwan' } });
    Player.unduck();
    if (Game.missed < 3) wait('redialGap', () => this.ring());
    else setTimeout(choFinal, FAST ? 1500 : TIMING.finalMessageDelay);
  }
};
ACT.callAccept = () => Call.accept();
ACT.callDecline = () => Call.miss();
ACT.callEnd = () => Call.end();

/* =========================================================
   FIT PHONE TO WINDOW
   ========================================================= */
function fit(){
  const bare = innerWidth < 500;
  document.body.classList.toggle('bare', bare);
  const W = bare ? 390 : 414, H = bare ? 844 : 868;
  const s = bare ? Math.min(innerWidth / W, innerHeight / H) : Math.min((innerWidth - 24) / W, (innerHeight - 24) / H, 1.15);
  $('#phone').style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();
updateBadges();
</script>
